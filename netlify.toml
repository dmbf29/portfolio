# Podcast feed address for "Rising in the Sun Belt". Spotify and other podcast apps are pointed at
# https://www.douglasberkley.com/podcast/rising-in-the-sun-belt.xml. This rule proxies (status 200, not a redirect)
# that address to the feed file, so the host behind it can be changed later by editing this one line without telling
# Spotify anything. Don't remove or reroute /podcast/rising-in-the-sun-belt.xml: the podcast depends on it.
[[redirects]]
  from = "/podcast/rising-in-the-sun-belt.xml"
  to = "https://res.cloudinary.com/dmbf29/raw/upload/rising_in_the_sun_belt/feed.xml"
  status = 200
  force = true

# Retired: the old address was only used by a throwaway test show on Spotify. 410 Gone tells Spotify the feed was
# removed on purpose so it drops that show. Safe to delete this rule once the test show is gone.
[[redirects]]
  from = "/podcast/feed.xml"
  to = "/podcast-feed-retired.txt"
  status = 410
  force = true
